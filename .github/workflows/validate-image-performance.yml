name: Validate image performance

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "**/*.html"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.webp"
      - "**/*.svg"
      - js/invoice-review-demo.js
      - scripts/validate_image_performance.py
      - .github/workflows/validate-image-performance.yml
  push:
    branches: [dev, main]
    paths:
      - "**/*.html"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.webp"
      - "**/*.svg"
      - js/invoice-review-demo.js
      - scripts/validate_image_performance.py
      - .github/workflows/validate-image-performance.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_image_performance.py
