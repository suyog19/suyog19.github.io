name: Validate training catalogue schema

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "training/**/*.html"
      - scripts/validate_training_catalogue_schema.py
      - data/training-courses.json
      - scripts/validate_article_structured_data.py
      - .github/workflows/validate-training-catalogue-schema.yml
  push:
    branches: [dev, main]
    paths:
      - "training/**/*.html"
      - scripts/validate_training_catalogue_schema.py
      - scripts/validate_article_structured_data.py
      - .github/workflows/validate-training-catalogue-schema.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_training_catalogue_schema.py
