name: Validate deployment indexing boundaries

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [dev]
    paths:
      - _headers
      - scripts/validate_deployment_indexing.py
      - .github/workflows/validate-deployment-indexing.yml

permissions:
  contents: read

jobs:
  deployed-hosts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_deployment_indexing.py --attempts 12 --retry-delay 15

  validator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests/test_validate_deployment_indexing.py
